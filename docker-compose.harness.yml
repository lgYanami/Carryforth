# =============================================================================
# Singleton test-relay backing stack.
#
# This uses a separate Compose project (`buzz-harness`) and alternate ports, but
# the project name and ports are fixed. It is therefore isolated from the
# default development stack, not from another checkout running this harness.
# `scripts/start-isolated-test-relay.sh` enforces that singleton boundary.
# Every published port is explicitly loopback-only.
#
#   Start:     ./scripts/start-isolated-test-relay.sh
#   Ports:     postgres 5471 · redis 6471 · minio 9471/9472
#   Relay (run separately by scripts/start-isolated-test-relay.sh):
#              main 3030 · health 8088 · metrics 9202
#
# Direct Compose use starts only the backing services and bypasses the
# singleton/tooling preflight. Prefer the script above.
# =============================================================================
services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17-bookworm@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    environment:
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: buzz_dev
      POSTGRES_DB: buzz
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5471:5432"
    volumes:
      - harness-postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/initdb/001-pgvector.sql:/docker-entrypoint-initdb.d/001-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
    ports:
      - "127.0.0.1:6471:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: buzz_dev
      MINIO_ROOT_PASSWORD: buzz_dev_secret
    ports:
      - "127.0.0.1:9471:9000"
      - "127.0.0.1:9472:9001"
    volumes:
      - harness-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 buzz_dev buzz_dev_secret &&
        mc mb --ignore-existing local/buzz-media &&
        mc anonymous set none local/buzz-media
      "
    restart: "no"

volumes:
  harness-postgres-data:
  harness-minio-data:
