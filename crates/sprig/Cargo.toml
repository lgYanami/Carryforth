[package]
name = "sprig"
# Independent version reserved for a possible future pinnable Sprig artifact.
# No supported packaged Sprig artifact is currently published, and this crate
# does not inherit the workspace version.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "All-in-one Carryforth ACP harness, agent, and developer MCP"

[[bin]]
name = "sprig"
path = "src/main.rs"

[dependencies]
buzz-acp = { path = "../buzz-acp" }
buzz-agent = { path = "../buzz-agent" }
buzz-dev-mcp = { path = "../buzz-dev-mcp" }
