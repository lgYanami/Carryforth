[package]
name = "buzz-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ACP harness that bridges Buzz events to AI agents"

[lib]
name = "buzz_acp"
path = "src/lib.rs"

[features]
# Test-only timing and evidence hooks for the Meeting V1 real-Codex acceptance
# runner. Production builds do not include the Unix-socket barrier or local
# acceptance NDJSON sink.
meeting-v1-acceptance = []

[[bin]]
name = "buzz-acp"
path = "src/main.rs"

[[bin]]
name = "buzz-meeting-v1-acceptance-barrier"
path = "src/bin/meeting_v1_acceptance_barrier.rs"
required-features = ["meeting-v1-acceptance"]

[dependencies]
# Internal
buzz-core = { workspace = true }
buzz-project-view = { workspace = true }
buzz-sdk = { workspace = true }
buzz-persona = { path = "../buzz-persona" }

# Nostr
nostr = { workspace = true }

# Async runtime
tokio = { workspace = true }

# WebSocket
tokio-tungstenite = { workspace = true }

# Codec (bounded line reads)
tokio-util = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures-util = { workspace = true }

# HTTP (channel discovery REST API)
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# IDs
uuid = { workspace = true }
chrono = { workspace = true }

# URL parsing
url = { workspace = true }

# NIP-98 HTTP auth signing
sha2 = { workspace = true }
base64 = "0.22"
hex = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }
atomic-write-file = "0.3"
zeroize = { workspace = true }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Config file
toml = "1.0"
dirs = "6"

# Filter expressions
evalexpr = { workspace = true }

# Process-group kill (safe wrapper around killpg) — Unix-only; kill_process_group
# has a #[cfg(not(unix))] fallback in acp.rs.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
httparse = "1"
tempfile = "3"
