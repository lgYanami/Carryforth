[project]
name = "harbor-buzz-testbed"
version = "0.1.0"
description = "Experimental trial provisioning and local Carryforth stack tooling"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "harbor-buzz-orchestra",
    "coincurve>=20",
    "psycopg[binary]>=3.2",
]

[project.urls]
Homepage = "https://github.com/lgYanami/Carryforth"
Repository = "https://github.com/lgYanami/Carryforth"
Issues = "https://github.com/lgYanami/Carryforth/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "ruff>=0.15",
]

[tool.uv.sources]
harbor-buzz-orchestra = { path = "..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
