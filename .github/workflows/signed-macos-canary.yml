name: macOS Community Canary (Unsigned)

# Source-only macOS validation. This lane is intentionally unsigned and
# unnotarized, creates no GitHub Release, and embeds no updater endpoint.
# macOS is not part of the first supported public release matrix.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned macOS community canary
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Require main
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$SOURCE_REF" != "refs/heads/main" ]]; then
            echo "::error::Community canary builds must run from main; got $SOURCE_REF"
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Refuse redistribution while release assets are blocked
        run: ./scripts/check-release-asset-inventory.sh --release

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          shared-key: macos-community-canary-release

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Derive canary version
        id: version
        run: |
          set -euo pipefail
          base_version=$(node -p "require('./desktop/package.json').version")
          if ! [[ "$base_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Desktop version '$base_version' is not semver"
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-community.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Patch canary version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"

      - name: Generate non-updating release config
        run: cd desktop && node scripts/build-release-config.mjs src-tauri/tauri.canary.conf.json

      - name: Build bundled sidecars
        run: |
          cargo build --locked --release \
            -p buzz-acp \
            -p buzz-agent \
            -p buzz-dev-mcp \
            -p git-credential-nostr \
            -p carryforth-cli
          ./scripts/bundle-sidecars.sh

      - name: Resolve mesh-llm revision
        id: mesh_rev
        run: |
          set -euo pipefail
          rev=$(python3 -c 'import tomllib; d=tomllib.load(open("Cargo.lock", "rb")); p=next(p for p in d["package"] if p["name"] == "mesh-llm-sdk"); print(p["source"].rsplit("#", 1)[1])')
          [[ -n "$rev" ]] || { echo "::error::could not resolve mesh-llm revision"; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "short=${rev:0:7}" >> "$GITHUB_OUTPUT"

      - name: Restore mesh llama build cache
        id: llama_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}

      - name: Build mesh llama native libraries
        if: steps.llama_cache.outputs.cache-hit != 'true'
        env:
          MESH_REV_SHORT: ${{ steps.mesh_rev.outputs.short }}
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path desktop/src-tauri/Cargo.toml
          mesh_root=$(find "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" -path "*/$MESH_REV_SHORT" -type d -name "$MESH_REV_SHORT" | head -1)
          if [[ -z "$mesh_root" ]]; then
            echo "::error::mesh-llm checkout for $MESH_REV_SHORT not found"
            exit 1
          fi
          export LLAMA_STAGE_BACKEND=metal
          export LLAMA_STAGE_BUILD_DIR="$GITHUB_WORKSPACE/.cache/mesh-llama/build-stage-abi-metal"
          export CMAKE_OSX_DEPLOYMENT_TARGET=10.15
          "$mesh_root/scripts/prepare-llama.sh" pinned
          "$mesh_root/scripts/build-llama.sh" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Save mesh llama build cache
        if: steps.llama_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}

      - name: Build unsigned Tauri app
        run: >-
          cd desktop && pnpm tauri build --verbose --no-sign --features mesh-llm
          --config src-tauri/tauri.canary.conf.json
          -- --locked
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          SKIPPY_LLAMA_AUTO_BUILD: "0"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

      - name: Stage unsigned community DMG
        id: artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dmg=$(find desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -type f | head -1)
          [[ -n "$dmg" ]] || { echo "::error::No DMG found"; exit 1; }
          hdiutil verify "$dmg"
          name="carryforth-desktop-${VERSION}-macos-aarch64-community-unsigned.dmg"
          cp "$dmg" "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned community canary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: carryforth-macos-community-canary-${{ github.sha }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Save pnpm store cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
