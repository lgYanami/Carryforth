name: Helm Source Validation

# Helm and Push Gateway remain source-only in the first Carryforth release.
# This workflow validates their checked-in charts but intentionally has no tag
# trigger, registry login, package permission, or publication job.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/charts/buzz/**"
      - "deploy/charts/buzz-push-gateway/**"
      - ".github/workflows/helm-chart.yml"
      - "ct.yaml"

permissions:
  contents: read

jobs:
  validate:
    name: Lint, unit test, and render source-only charts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.4

      - name: Install helm-unittest plugin
        run: helm plugin install --version 0.8.2 https://github.com/helm-unittest/helm-unittest

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@0d28d3144d3a25ea2cc349d6e59901c4ff469b3b # v2

      - name: Build main chart dependencies
        run: helm dependency build deploy/charts/buzz

      - name: Lint all charts
        run: ct lint --config ct.yaml --all

      - name: Unit test main chart
        run: helm unittest deploy/charts/buzz

      - name: Render main chart fixtures
        run: |
          set -euo pipefail
          for fixture in deploy/charts/buzz/ci/*-values.yaml deploy/charts/buzz/tests/fixtures/*-values.yaml; do
            helm template carryforth-source-check deploy/charts/buzz -f "$fixture" >/dev/null
          done

      - name: Validate Push Gateway source chart
        run: deploy/charts/buzz-push-gateway/tests/render.sh
