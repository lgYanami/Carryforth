name: Carryforth Community Release

# The first public release lane intentionally publishes only the supported
# Linux surface. Desktop packages are community artifacts: they are unsigned,
# contain no updater configuration, and never contact a legacy release feed.
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version matching the v-prefixed dispatch tag"
        required: true

permissions: {}

jobs:
  setup:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      cf_version: ${{ steps.components.outputs.cf_version }}
      desktop_version: ${{ steps.components.outputs.desktop_version }}
      relay_version: ${{ steps.components.outputs.relay_version }}
      relay_image: ${{ steps.relay.outputs.image }}
      relay_provenance_sha256: ${{ steps.relay.outputs.provenance_sha256 }}
      relay_source_ref: ${{ steps.relay.outputs.source_ref }}
      relay_source_sha: ${{ steps.relay.outputs.source_sha }}
    steps:
      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$version'. Expected semver."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable tag-bound source
        id: source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          scripts/verify-release-ref.sh v "$VERSION"
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "::error::Release checkout is not clean"
            git status --short
            exit 1
          fi
          echo "source_sha=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Resolve independently versioned components
        id: components
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          cf_version=$(jq -er '.packages[] | select(.name == "carryforth-cli") | .version' <<< "$metadata")
          relay_version=$(jq -er '.packages[] | select(.name == "buzz-relay") | .version' <<< "$metadata")
          desktop_package_version=$(jq -er '.version' desktop/package.json)
          desktop_tauri_version=$(jq -er '.version' desktop/src-tauri/tauri.conf.json)
          desktop_metadata=$(cargo metadata --locked --no-deps --format-version 1 \
            --manifest-path desktop/src-tauri/Cargo.toml)
          desktop_cargo_version=$(jq -er \
            '.packages[] | select(.name == "buzz-desktop") | .version' \
            <<< "$desktop_metadata")
          desktop_lock_version=$(awk '
            BEGIN { RS = ""; FS = "\n"; found = 0; locked = "" }
            $0 ~ /(^|\n)name = "buzz-desktop"(\n|$)/ {
              found++
              for (line = 1; line <= NF; line++) {
                if ($line ~ /^version = "/) {
                  locked = $line
                  sub(/^version = "/, "", locked)
                  sub(/"$/, "", locked)
                }
              }
            }
            END {
              if (found != 1 || locked == "") exit 1
              print locked
            }
          ' desktop/src-tauri/Cargo.lock)

          for declared in \
            "$desktop_package_version" \
            "$desktop_tauri_version" \
            "$desktop_cargo_version" \
            "$desktop_lock_version"; do
            if [[ "$declared" != "$RELEASE_VERSION" ]]; then
              echo "::error::Desktop release v${RELEASE_VERSION} does not match all committed Desktop versions (${desktop_package_version}, ${desktop_tauri_version}, ${desktop_cargo_version}, ${desktop_lock_version})"
              exit 1
            fi
          done

          echo "cf_version=$cf_version" >> "$GITHUB_OUTPUT"
          echo "desktop_version=$desktop_package_version" >> "$GITHUB_OUTPUT"
          echo "relay_version=$relay_version" >> "$GITHUB_OUTPUT"

      - name: Verify open-source release surface
        run: ./scripts/check-open-source-release-surface.sh --release-source

      - name: Verify public local bootstrap contract
        run: ./scripts/test-carryforth-local-deployment.sh

      - name: Install Relay verification tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Verify protected Relay tag and provenance
        id: relay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELAY_VERSION: ${{ steps.components.outputs.relay_version }}
        run: |
          set -euo pipefail
          image="ghcr.io/lgyanami/carryforth-relay:${RELAY_VERSION}"
          source_ref="refs/tags/relay-v${RELAY_VERSION}"
          source_sha=$(git rev-parse "${source_ref}^{commit}")
          index_file="$RUNNER_TEMP/carryforth-relay-index.json"
          evidence_file="$RUNNER_TEMP/carryforth-relay-provenance-${RELAY_VERSION}.json"

          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          skopeo inspect --raw "docker://${image}" > "$index_file"
          digest=$(skopeo manifest-digest "$index_file")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -e --arg source_sha "$source_sha" '
            [.manifests[] | select(
              .platform.os == "linux"
              and (.platform.architecture == "amd64" or .platform.architecture == "arm64")
            ) | .platform.architecture] as $architectures
            | ($architectures | index("amd64")) != null
            and ($architectures | index("arm64")) != null
            and .annotations["org.opencontainers.image.revision"] == $source_sha
          ' "$index_file" >/dev/null

          gh attestation verify "oci://${image}@${digest}" \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$source_sha" \
            --source-ref "$source_ref" \
            --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/docker.yml" \
            --deny-self-hosted-runners \
            --format json > "$evidence_file"
          jq -e 'length > 0' "$evidence_file" >/dev/null
          provenance_sha256=$(sha256sum "$evidence_file" | cut -d' ' -f1)

          echo "image=${image}@${digest}" >> "$GITHUB_OUTPUT"
          echo "provenance_sha256=$provenance_sha256" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Preserve verified Relay provenance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: carryforth-relay-provenance-${{ steps.components.outputs.relay_version }}
          path: ${{ runner.temp }}/carryforth-relay-provenance-${{ steps.components.outputs.relay_version }}.json
          if-no-files-found: error
          retention-days: 14

  linux-community:
    name: Linux community artifacts (unsigned)
    runs-on: ubuntu-latest
    container: ubuntu:22.04@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982
    needs: setup
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      VERSION: ${{ needs.setup.outputs.version }}
      CF_VERSION: ${{ needs.setup.outputs.cf_version }}
      DESKTOP_VERSION: ${{ needs.setup.outputs.desktop_version }}
      RELAY_VERSION: ${{ needs.setup.outputs.relay_version }}
      RELAY_IMAGE: ${{ needs.setup.outputs.relay_image }}
      RELAY_PROVENANCE_SHA256: ${{ needs.setup.outputs.relay_provenance_sha256 }}
      RELAY_SOURCE_REF: ${{ needs.setup.outputs.relay_source_ref }}
      RELAY_SOURCE_SHA: ${{ needs.setup.outputs.relay_source_sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=120 \
            build-essential \
            ca-certificates \
            curl \
            desktop-file-utils \
            file \
            git \
            jq \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            squashfs-tools \
            wget \
            xdg-utils

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify immutable tag-bound source
        run: scripts/verify-release-ref.sh v "$VERSION"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Verify open-source release surface
        run: ./scripts/check-open-source-release-surface.sh --release-source

      - name: Verify public local bootstrap contract
        run: ./scripts/test-carryforth-local-deployment.sh

      - name: Verify public Cargo package metadata
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 \
            > "$RUNNER_TEMP/workspace-metadata.json"
          cargo metadata --locked --no-deps --format-version 1 \
            --manifest-path desktop/src-tauri/Cargo.toml \
            > "$RUNNER_TEMP/desktop-metadata.json"
          jq -s -e --arg repository "https://github.com/lgYanami/Carryforth" '
            all(.[].packages[];
              .license == "Apache-2.0" and .repository == $repository
            )
          ' \
            "$RUNNER_TEMP/workspace-metadata.json" \
            "$RUNNER_TEMP/desktop-metadata.json" >/dev/null

      - name: Download verified Relay provenance evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: carryforth-relay-provenance-${{ needs.setup.outputs.relay_version }}
          path: ${{ runner.temp }}/relay-provenance

      - name: Verify preserved Relay provenance evidence
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/relay-provenance/carryforth-relay-provenance-${RELAY_VERSION}.json"
          echo "${RELAY_PROVENANCE_SHA256}  ${evidence}" | sha256sum -c
          jq -e 'length > 0' "$evidence" >/dev/null

      - name: Install pinned AppImage tooling
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          wget -q --tries=3 --timeout=30 -O /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum -c
          install -m 755 /tmp/appimagetool /usr/local/bin/appimagetool
          wget -q --tries=3 --timeout=30 -O /tmp/appimage-runtime \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/appimage-runtime" | sha256sum -c
          install -D -m 644 /tmp/appimage-runtime /usr/local/lib/appimage-runtime
          echo "APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime" >> "$GITHUB_ENV"

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Generate non-updating release config
        run: cd desktop && node scripts/build-release-config.mjs

      - name: Build bundled sidecars and cf
        run: |
          cargo build --locked --release \
            -p buzz-acp \
            -p buzz-agent \
            -p buzz-dev-mcp \
            -p git-credential-nostr \
            -p carryforth-cli
          ./scripts/bundle-sidecars.sh
          target/release/cf --version | grep -F "${CF_VERSION}"

      - name: Build unsigned Linux Desktop packages
        run: >-
          cd desktop && pnpm tauri build --verbose --ci --bundles deb,appimage
          --config src-tauri/tauri.release.conf.json
          -- --locked
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Fix AppImage runtime compatibility
        run: |
          set -euo pipefail
          mapfile -t appimages < <(find desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f)
          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one AppImage, found ${#appimages[@]}"
            exit 1
          fi
          desktop/scripts/fix-appimage.sh "${appimages[0]}"

      - name: Stage normalized community artifacts
        id: artifacts
        env:
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
        run: |
          set -euo pipefail
          bundle_dir="desktop/src-tauri/target/release/bundle"
          deb=$(find "$bundle_dir/deb" -name '*.deb' -type f | head -1)
          appimage=$(find "$bundle_dir/appimage" -name '*.AppImage' -type f | head -1)
          test -n "$deb" && test -n "$appimage" && test -x target/release/cf

          dist="$RUNNER_TEMP/carryforth-release"
          desktop_deb="carryforth-desktop-${VERSION}-linux-x86_64-community-unsigned.deb"
          desktop_appimage="carryforth-desktop-${VERSION}-linux-x86_64-community-unsigned.AppImage"
          cli_archive="cf-${CF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          local_stack_archive="carryforth-local-stack-${VERSION}.tar.gz"
          release_manifest="carryforth-release-manifest-${VERSION}.json"
          relay_provenance="carryforth-relay-provenance-${RELAY_VERSION}.json"
          local_stack_dir="$dist/carryforth-local-stack-${VERSION}"
          local_stack_runtime_dir="$local_stack_dir/deploy/local"
          mkdir -p "$dist/cf/licenses"
          mkdir -p "$local_stack_runtime_dir"
          cp "$deb" "$dist/$desktop_deb"
          cp "$appimage" "$dist/$desktop_appimage"
          cp target/release/cf "$dist/cf/cf"
          cp \
            "$RUNNER_TEMP/relay-provenance/$relay_provenance" \
            "$dist/$relay_provenance"
          cp LICENSE NOTICE UPSTREAM.md "$dist/cf/licenses/"
          cp release/THIRD_PARTY_ASSETS.md "$dist/cf/licenses/"
          tar -C "$dist/cf" -czf "$dist/$cli_archive" cf licenses
          rm -rf "$dist/cf"

          cp \
            deploy/local/README.md \
            deploy/local/compose.yml \
            deploy/local/run.sh \
            deploy/local/.env.example \
            "$local_stack_runtime_dir/"
          mkdir -p "$local_stack_dir/licenses"
          cp LICENSE NOTICE UPSTREAM.md "$local_stack_dir/licenses/"
          cp release/THIRD_PARTY_ASSETS.md "$local_stack_dir/licenses/"
          printf '%s\n' "$RELAY_IMAGE" > "$local_stack_runtime_dir/RELAY_IMAGE"
          source_date_epoch=$(git show -s --format=%ct "$SOURCE_SHA")
          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C "$dist" \
            -czf "$dist/$local_stack_archive" \
            "$(basename "$local_stack_dir")"
          rm -rf "$local_stack_dir"

          jq -n \
            --arg version "$VERSION" \
            --arg source_sha "$SOURCE_SHA" \
            --arg cf_version "$CF_VERSION" \
            --arg desktop_version "$DESKTOP_VERSION" \
            --arg desktop_deb "$desktop_deb" \
            --arg desktop_appimage "$desktop_appimage" \
            --arg cli_archive "$cli_archive" \
            --arg local_stack_archive "$local_stack_archive" \
            --arg relay_version "$RELAY_VERSION" \
            --arg relay_image "$RELAY_IMAGE" \
            --arg relay_source_ref "$RELAY_SOURCE_REF" \
            --arg relay_source_sha "$RELAY_SOURCE_SHA" \
            --arg relay_provenance "$relay_provenance" \
            --arg relay_provenance_sha256 "$RELAY_PROVENANCE_SHA256" \
            '{
              schema: 1,
              version: $version,
              desktop_version: $desktop_version,
              source_sha: $source_sha,
              component_versions: {
                cf: $cf_version,
                desktop: $desktop_version,
                relay: $relay_version
              },
              release_status: {
                desktop: "community-unsigned",
                updater_embedded: false
              },
              relay_image: {
                reference: $relay_image,
                immutability: "write-once full semver tag resolved to a verified linux/amd64 and linux/arm64 digest",
                source: {
                  ref: $relay_source_ref,
                  sha: $relay_source_sha
                },
                provenance: {
                  verification: "github-attestation-verified",
                  predicate_type: "https://slsa.dev/provenance/v1",
                  signer_workflow: "github.com/lgYanami/Carryforth/.github/workflows/docker.yml",
                  evidence_file: $relay_provenance,
                  evidence_sha256: $relay_provenance_sha256
                }
              },
              artifacts: [
                $desktop_deb,
                $desktop_appimage,
                $cli_archive,
                $local_stack_archive,
                $relay_provenance
              ]
            }' > "$dist/$release_manifest"

          (
            cd "$dist"
            sha256sum \
              "$desktop_deb" \
              "$desktop_appimage" \
              "$cli_archive" \
              "$local_stack_archive" \
              "$relay_provenance" \
              "$release_manifest" \
              > SHA256SUMS
          )
          echo "dist=$dist" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned community artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: carryforth-${{ needs.setup.outputs.version }}-linux-community
          path: ${{ steps.artifacts.outputs.dist }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish versioned community release
    runs-on: ubuntu-latest
    needs: [setup, linux-community]
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable tag-bound source
        run: scripts/verify-release-ref.sh v "$VERSION"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Verify open-source release surface
        run: ./scripts/check-open-source-release-surface.sh --release-source

      - name: Download staged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: carryforth-${{ needs.setup.outputs.version }}-linux-community
          path: dist

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Attest public artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            dist/carryforth-*
            dist/cf-*
            dist/SHA256SUMS

      - name: Publish immutable versioned GitHub release
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          release_manifest="dist/carryforth-release-manifest-${VERSION}.json"
          relay_image=$(jq -er '.relay_image.reference' "$release_manifest")
          if [[ -f CHANGELOG.md ]]; then
            awk "/^## v${VERSION}\$/{found=1; next} found && /^## v/{exit} found" CHANGELOG.md > "$notes"
          fi
          if [[ ! -s "$notes" ]]; then
            printf 'Carryforth community release v%s.\n' "$VERSION" > "$notes"
          fi
          cat >> "$notes" <<'EOF'

          > **Community signing status:** the Linux Desktop packages in this
          > release are unsigned community artifacts. No updater or remote
          > release feed is embedded. Verify `SHA256SUMS` and the GitHub build
          > provenance before installation.

          The versioned `carryforth-local-stack` archive contains the supported
          Linux local-only Relay bootstrap under `deploy/local`. Its
          `deploy/local/RELAY_IMAGE` file contains the release-qualified,
          multi-architecture Relay digest.
          EOF
          printf '\n**Required Relay:** `%s`\n' "$relay_image" >> "$notes"

          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease --latest=false)
          fi

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Release v${VERSION} already exists; public release assets are immutable"
            exit 1
          fi
          gh release create "v${VERSION}" dist/* \
            --verify-tag \
            --target "${{ needs.setup.outputs.source_sha }}" \
            --title "Carryforth Community v${VERSION}" \
            --notes-file "$notes" \
            "${prerelease[@]}"
