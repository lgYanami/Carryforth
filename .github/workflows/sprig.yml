name: Sprig source build

# Builds and verifies Sprig — one Linux multicall binary for Carryforth's
# source-development and agent surfaces:
#   buzz-acp       ACP harness that bridges Carryforth events to the LLM agent
#   buzz-agent     ACP-compliant agent (spawns MCP, calls LLMs)
#   buzz-dev-mcp   Developer MCP server (multicall: rg, tree, cf,
#                    git-credential-nostr, git-sign-nostr)
#   cf             Agent-first Carryforth CLI, including Project View
#
# Targets: x86_64-unknown-linux-musl and aarch64-unknown-linux-musl (static
# musl so the archive runs on modern Linux without libc surprises).
#
# This workflow never publishes a GitHub Release. Its short-lived Actions
# artifacts are CI evidence, not supported Carryforth release artifacts.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/sprig.yml"
      - "scripts/build-sprig.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/sprig/**"
      - "crates/buzz-acp/**"
      - "crates/buzz-agent/**"
      - "crates/buzz-dev-mcp/**"
      - "crates/carryforth-cli/**"
      - "crates/buzz-sdk/**"
      - "crates/buzz-project-view/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install cross
        uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cross@0.2.5

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          WORKSPACE_VERSION=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name=="sprig") | .version')
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${WORKSPACE_VERSION}+git.${SHORT_SHA}"
          {
            echo "workspace_version=$WORKSPACE_VERSION"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved source-build version=$VERSION"

      - name: Build & package Sprig
        id: pkg
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.ver.outputs.version }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ARCHIVE_BASENAME="sprig-${TARGET}"
          ARCHIVE_BASENAME="$ARCHIVE_BASENAME" \
            ./scripts/build-sprig.sh "$VERSION" "$TARGET"
          ARCHIVE="dist/${ARCHIVE_BASENAME}.tar.gz"
          test -f "$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "archive_name=${ARCHIVE_BASENAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sprig-${{ matrix.target }}
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7
