name: Carryforth Relay Image

# Builds the public Local Relay image. Only a relay-v tag push can publish.
# workflow_dispatch is deliberately build/validation-only: canonical image
# aliases always originate from the protected tag event.
on:
  push:
    branches: [main]
    tags: ["relay-v[0-9]*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "migrations/**"
      - "schema/**"
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version matching the relay-v tag"
        required: true

concurrency:
  group: relay-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.event_name == 'pull_request' }}

permissions: {}

jobs:
  prepare:
    name: Resolve public image name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
    steps:
      - name: Resolve and validate GHCR coordinate
        id: image
        env:
          CONFIGURED_IMAGE: ${{ vars.GHCR_IMAGE }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image=${CONFIGURED_IMAGE:-ghcr.io/${owner}/carryforth-relay}
          if [[ "$image" != "${image,,}" ]]; then
            echo "::error::OCI image names must be lower-case: $image"
            exit 1
          fi
          if ! [[ "$image" =~ ^ghcr\.io/[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "::error::GHCR_IMAGE must be a ghcr.io image coordinate; got '$image'"
            exit 1
          fi
          echo "image_name=$image" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: prepare
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag-bound release source
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#relay-v}}"
          scripts/verify-release-ref.sh relay-v "$version"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'

      - name: Verify Relay package version matches the release tag
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#relay-v}}"
          declared=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "buzz-relay") | .version')
          if [[ "$version" != "$declared" ]]; then
            echo "::error::relay-v${version} does not match buzz-relay package version ${declared}"
            exit 1
          fi

      - name: Verify open-source release surface
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: ./scripts/check-open-source-release-surface.sh --release-source

      - name: Verify public local bootstrap contract
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: ./scripts/test-carryforth-local-deployment.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Log in to GHCR for publication
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ github.event_name != 'workflow_dispatch' || inputs.version == '' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name != 'workflow_dispatch' || inputs.version == '' }}
            type=semver,pattern={{version}},match=^relay-v(.*)$,value=${{ github.event_name == 'workflow_dispatch' && format('relay-v{0}', inputs.version) || '' }}
            type=semver,pattern={{major}}.{{minor}},match=^relay-v(.*)$,value=${{ github.event_name == 'workflow_dispatch' && format('relay-v{0}', inputs.version) || '' }}
            type=semver,pattern={{major}},match=^relay-v(.*)$,value=${{ github.event_name == 'workflow_dispatch' && format('relay-v{0}', inputs.version) || '' }}
          labels: |
            org.opencontainers.image.title=Carryforth Local Relay
            org.opencontainers.image.description=Local-first relay for the Carryforth collaboration platform
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}-buildcache:${{ matrix.arch }}
          cache-to: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && format('type=registry,ref={0}-buildcache:{1},mode=max,compression=zstd', env.IMAGE_NAME, matrix.arch) || '' }}

      - name: Export digest
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: relay-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: [prepare, build]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
    steps:
      - name: Download per-architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: relay-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create provenance staging manifest
        id: manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#relay-v}"
          staging_tag="${IMAGE_NAME}:provenance-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          digests=()
          for digest in *; do
            digests+=("${IMAGE_NAME}@sha256:${digest}")
          done
          [[ ${#digests[@]} -eq 2 ]] || { echo "::error::Expected two architecture digests"; exit 1; }

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:org.opencontainers.image.version=${version}" \
            --tag "$staging_tag" \
            "${digests[@]}"
          merged_digest=$(docker buildx imagetools inspect "$staging_tag" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          [[ "$merged_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$staging_tag" --raw \
            | jq -e --arg source_sha "$GITHUB_SHA" '
                [.manifests[] | select(
                  .platform.os == "linux"
                  and (.platform.architecture == "amd64" or .platform.architecture == "arm64")
                ) | .platform.architecture] as $architectures
                | ($architectures | index("amd64")) != null
                and ($architectures | index("arm64")) != null
                and .annotations["org.opencontainers.image.revision"] == $source_sha
              ' >/dev/null
          echo "digest=$merged_digest" >> "$GITHUB_OUTPUT"
          echo "staging_tag=$staging_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Verify provenance before canonical publication
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/carryforth-relay-provenance.json"
          verified=false
          for attempt in 1 2 3; do
            if gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/docker.yml" \
              --deny-self-hosted-runners \
              --format json > "$evidence"; then
              verified=true
              break
            fi
            rm -f "$evidence"
            sleep $((attempt * 5))
          done
          if [[ "$verified" != true ]]; then
            echo "::error::Relay provenance could not be verified; canonical aliases were not published"
            exit 1
          fi
          jq -e 'length > 0' "$evidence" >/dev/null

      - name: Verify the staged digest is anonymously readable
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          if ! docker buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}" >/dev/null; then
            echo "::error::The GHCR package is not publicly readable; canonical aliases were not published. Set the Carryforth Relay package visibility to public, then rerun the protected tag workflow."
            exit 1
          fi

      - name: Restore GHCR publication login
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish write-once semver and movable aliases
        id: aliases
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          full_tag="${IMAGE_NAME}:${VERSION}"
          inspect_error="$RUNNER_TEMP/full-tag-inspect-error"
          existing=false

          if existing_manifest=$(docker buildx imagetools inspect "$full_tag" \
            --format '{{json .Manifest}}' 2>"$inspect_error"); then
            existing=true
            existing_digest=$(jq -er '.digest' <<< "$existing_manifest")
            existing_source=$(docker buildx imagetools inspect "$full_tag" --raw \
              | jq -er '.annotations["org.opencontainers.image.revision"]')
            if [[ "$existing_digest" != "$DIGEST" || "$existing_source" != "$GITHUB_SHA" ]]; then
              echo "::error::Full Relay semver tag ${full_tag} is write-once and already resolves to digest ${existing_digest} from source ${existing_source}; refusing ${DIGEST} from ${GITHUB_SHA}"
              exit 1
            fi
          elif ! grep -Eqi \
            '404( Not Found)?|manifest unknown|name unknown|(^|[[:space:]:])not found([[:space:].]|$)' \
            "$inspect_error"; then
            echo "::error::Could not establish whether ${full_tag} already exists"
            cat "$inspect_error" >&2
            exit 1
          fi

          if [[ "$existing" != true ]]; then
            docker buildx imagetools create --tag "$full_tag" "${IMAGE_NAME}@${DIGEST}"
          fi

          published_manifest=$(docker buildx imagetools inspect "$full_tag" \
            --format '{{json .Manifest}}')
          published_digest=$(jq -er '.digest' <<< "$published_manifest")
          published_source=$(docker buildx imagetools inspect "$full_tag" --raw \
            | jq -er '.annotations["org.opencontainers.image.revision"]')
          if [[ "$published_digest" != "$DIGEST" || "$published_source" != "$GITHUB_SHA" ]]; then
            echo "::error::Published full Relay semver tag failed digest/source verification"
            exit 1
          fi

          movable_tags=()
          if [[ "$VERSION" != *-* ]]; then
            major="${VERSION%%.*}"
            minor="${VERSION%.*}"
            movable_tags=(
              "${IMAGE_NAME}:${minor}"
              "${IMAGE_NAME}:${major}"
              "${IMAGE_NAME}:latest"
            )
            alias_args=()
            for tag in "${movable_tags[@]}"; do
              alias_args+=(--tag "$tag")
            done
            docker buildx imagetools create "${alias_args[@]}" "${IMAGE_NAME}@${DIGEST}"
          fi

          echo "full_tag=$full_tag" >> "$GITHUB_OUTPUT"
          {
            echo 'movable_tags<<EOF'
            printf '%s\n' "${movable_tags[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish summary
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          FULL_TAG: ${{ steps.aliases.outputs.full_tag }}
          MOVABLE_TAGS: ${{ steps.aliases.outputs.movable_tags }}
        run: |
          {
            echo "### Published Carryforth Local Relay"
            echo
            echo "**Image:** \`${IMAGE_NAME}\`"
            echo "**Digest:** \`${DIGEST}\`"
            echo
            echo "**Write-once full semver tag:** \`${FULL_TAG}\`"
            echo '```'
            echo "$MOVABLE_TAGS"
            echo '```'
            echo
            echo "Verify provenance:"
            echo '```'
            echo "gh attestation verify oci://${IMAGE_NAME}@${DIGEST} --owner ${GITHUB_REPOSITORY_OWNER}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
