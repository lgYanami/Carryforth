# RETIRED_COMPOSE_TOMBSTONE=1
#
# The former Buzz/Block production Compose bundle is intentionally inert. Keep
# this file service-free so `docker compose up` cannot pull a legacy image or
# start a process against historical data. The supported stack lives in
# deploy/local and requires a pinned Carryforth Relay image.
name: carryforth-retired-compose

x-carryforth-retired:
  replacement: ../local
  preserves-historical-data: true

services: {}
